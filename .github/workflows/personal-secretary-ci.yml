name: Personal Secretary CI

on:
  pull_request:
    paths:
      - 'personal-secretary/**'
      - 'render.yaml'
      - '.github/workflows/personal-secretary-ci.yml'
  push:
    branches: [main]
    paths:
      - 'personal-secretary/**'
      - 'render.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-secretary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gurukul-personal-secretary ./personal-secretary
