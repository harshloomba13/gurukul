services:
  - type: web
    name: madhushala-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port 8000"
    autoDeploy: true

  - type: web
    name: madhushala-ui
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run ui/app.py --server.port 8001"
    autoDeploy: true

  - type: web
    name: gurukul-personal-secretary-harsh
    runtime: docker
    plan: free
    dockerfilePath: ./personal-secretary/Dockerfile
    dockerContext: ./personal-secretary
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SECRETARY_API_KEY
        generateValue: true
      - key: SECRETARY_SIGNING_KEY
        generateValue: true
      - key: SECRETARY_PHONE
        sync: false
      - key: SECRETARY_FIRST_NAME
        sync: false
      - key: SECRETARY_LAST_NAME
        sync: false
      - key: SECRETARY_EMAIL
        sync: false

  - type: web
    name: gurukul-executor
    runtime: docker
    plan: starter
    dockerfilePath: ./executor/Dockerfile
    dockerContext: ./executor
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: executor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EXECUTOR_API_KEY
        generateValue: true
      - key: QUOTE_SIGNING_KEY
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: WODIFY_STORE_URL
        sync: false
